name: website

# The website, site/, uploaded to Azure Static Web Apps on every push to main that changes it.
# Nothing is built here: site/data.json is written by `facsimile site` from the committed
# results and committed with the page, and CI's tests/test_site.py fails if it has fallen behind
# them. The same deploy path as peterparker.ca and the other project pages: the upload token is
# the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN, never a file in the repository.
#
# Off until the site exists: docs/deploy.md step 3 adds the secret and sets the repository
# variable SITE = on. Until then every run skips rather than failing.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SITE == 'on' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stylesheet and script carry the commit, so a browser never keeps last deploy's copy.
      - name: Stamp style.css and app.js with the commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s/(href|src)=\"(style\.css|app\.js)\"/\1=\"\2?v=${v}\"/g" site/index.html site/architecture.html
          grep -c "?v=${v}" site/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
