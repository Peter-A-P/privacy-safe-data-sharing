<svg xmlns="http://www.w3.org/2000/svg" width="1226" height="986" viewBox="0 0 1226 986" role="img" aria-label="Three public datasets of real people are prepared and split three ways, synthesised six ways at six privacy budgets and three seeds, attacked with the three legal criteria and membership inference checked against the reference libraries, scored for train-on-synthetic, test-on-real utility, and summarised as a surface with a recommendation rule that the release gate confirms." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
